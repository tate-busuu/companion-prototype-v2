<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Busuu Companion</title>
<style>
  @font-face{font-family:"BW Nista Grotesk";src:url("fonts/BwNistaGrot-Rg.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"BW Nista Grotesk";src:url("fonts/BwNistaGrot-Md.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"BW Nista Grotesk";src:url("fonts/BwNistaGrot-Bd.woff2") format("woff2");font-weight:600 700;font-display:swap}
  @font-face{font-family:"BW Nista Grotesk";src:url("fonts/BwNistaGrot-xBd.woff2") format("woff2");font-weight:800 900;font-display:swap}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:#0f1216}
  :focus-visible{outline:2px solid #116EEE;outline-offset:2px}
  .devwrap{position:fixed;inset:0}
  .device{position:absolute;top:0;left:0;width:1280px;transform-origin:top left;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 24px 60px -12px rgba(0,0,0,.55)}
  .device .chrome{height:30px;background:#e7e9ec;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid #d8dade;font:500 12px -apple-system,sans-serif;color:#6d6d72}
  .device .chrome i{width:11px;height:11px;border-radius:50%;background:#ff5f57;display:inline-block}
  .device .chrome i:nth-child(2){background:#febc2e}.device .chrome i:nth-child(3){background:#28c840}
  .device .chrome span{flex:1;text-align:center;margin-right:50px}
  .device .chrome + .cs{height:790px}
  .dbframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0f1216}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

  :root{--mono:ui-monospace,Menlo,monospace}
  .cs{
    --text-primary:#121b26; --text-secondary:#1e2d40; --text-tertiary:#4b5766; --ink-r:#1a1a2e; --grey-r:#6c757d; --body-r:#495057;
    --busuublue-100:#116EEE; --busuublue-5:#f3f8fe; --busuublue-20:#e4effd; --cta:#1967d2;
    --success:#0EBE75; --success-ink:#067a4a; --lime-5:#f3fefa; --lime-20:#bbf7d0;
    --amber-5:#fffbeb; --amber-20:#fde68a; --amber-100:#92400e; --amber-120:#d97706;
    --utilityred-5:#fef4f5; --utilityred-20:#fecaca; --utilityred-100:#e2222e;
    --neutral-5:#f3f4f6; --neutral-100:#9ca3af; --row-border:#E5E7EB; --border-subtle:#dae1ea; --hd-border:#e9ecef; --ground:#f8f9fa;
    --dimline:#be185d;
    width:1280px;height:820px;position:relative;display:flex;flex-direction:column;overflow:hidden;
    background:var(--ground);color:var(--ink-r);font-family:"BW Nista Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;color-scheme:light;
  }
  .cs *{box-sizing:border-box}
  .cs button{font-family:inherit;cursor:pointer;color:inherit}
  .cs button:focus-visible,.cs a:focus-visible{outline:2px solid var(--busuublue-100);outline-offset:2px}
  .cs a{color:var(--cta)}

  .db-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;padding:0 24px;background:#fff;border-bottom:1px solid var(--hd-border);flex-shrink:0}
  .db-hd img{height:22px;width:auto;display:block}
  .db-hd .rt{justify-self:end;display:flex;align-items:center;gap:14px}
  .db-hd .set{background:none;border:0;font-size:14px;color:var(--grey-r);padding:6px 0}
  .av{width:30px;height:30px;border-radius:50%;background:var(--busuublue-100);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
  .tabs{display:flex;background:#e9ecf0;border-radius:999px;padding:3px}
  .tabs button{height:32px;border:0;border-radius:999px;background:none;font-size:13px;font-weight:700;color:var(--text-tertiary);padding:0 18px}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--ink-r);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  .recbar{display:flex;align-items:center;gap:12px;padding:8px 24px;background:var(--utilityred-5);border-bottom:1px solid var(--utilityred-20);font-size:13px;color:var(--ink-r);flex-shrink:0}
  .recbar .rd{width:9px;height:9px;border-radius:50%;background:var(--utilityred-100);animation:pulse 1.4s infinite}
  .recbar b{font-weight:700}
  .recbar .sp{flex:1}
  .recbar time{font-variant-numeric:tabular-nums;font-weight:700}
  @keyframes pulse{50%{opacity:.35}}

  .db-body{flex:1;min-height:0;display:grid}
  .col{min-height:0;overflow-y:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
  .col+.col{border-left:1px solid var(--hd-border)}

  .card{background:#fff;border-radius:12px;padding:18px 20px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .sec-h h3{margin:0;font-size:15px;font-weight:700;color:var(--ink-r)}
  .sec-h .aux{font-size:12px;color:var(--grey-r)}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary)}
  .hint{font-size:12px;color:var(--grey-r)}
  .btn{height:36px;border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;border:1px solid var(--row-border);background:#fff;color:var(--ink-r);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
  .btn.pri{background:var(--cta);border-color:var(--cta);color:#fff}
  .btn.rec{background:var(--utilityred-100);border-color:var(--utilityred-100);color:#fff}
  .btn.ghost{border-color:transparent;background:none;color:var(--grey-r)}
  .btn.sm{height:30px;padding:0 11px;font-size:12px}
  .linkbtn{background:none;border:0;padding:0;font-size:12.5px;font-weight:700;color:var(--cta);text-decoration:none;display:inline-flex;align-items:center;gap:4px}

  .pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .p-good{background:var(--lime-5);color:var(--success);box-shadow:inset 0 0 0 1px var(--lime-20)}
  .p-blue{background:var(--busuublue-5);color:var(--busuublue-100);box-shadow:inset 0 0 0 1px var(--busuublue-20)}
  .p-warn{background:var(--amber-5);color:var(--amber-120);box-shadow:inset 0 0 0 1px var(--amber-20)}
  .p-grey{background:var(--neutral-5);color:var(--grey-r)}
  .p-red{background:var(--utilityred-5);color:var(--utilityred-100)}

  .now{border-radius:14px;padding:18px 20px;background:#fff;display:flex;flex-direction:column;gap:12px;border:1px solid var(--row-border)}
  .now.live{border-color:#bcd6fb;box-shadow:0 0 0 4px var(--busuublue-5)}
  .now.recording{border-color:var(--utilityred-20);background:linear-gradient(var(--utilityred-5),#fff 70%)}
  .now.ready{border-color:var(--lime-20);background:linear-gradient(var(--lime-5),#fff 70%)}
  .now-top{display:flex;align-items:flex-start;gap:14px}
  .now-top .tx{flex:1;min-width:0}
  .now-k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--cta);display:flex;align-items:center;gap:6px}
  .now.recording .now-k{color:var(--utilityred-100)}
  .now.ready .now-k{color:var(--success-ink)}
  .now-t{font-size:17px;font-weight:700;color:var(--ink-r);margin-top:3px;line-height:1.3}
  .now-m{font-size:12.5px;color:var(--grey-r);margin-top:2px}
  .now-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .plat{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:800;color:#fff}
  .plat.teams{background:#5b5fc7}.plat.meet{background:#0f9d58}.plat.zoom{background:#2d8cff}
  .livedot{width:8px;height:8px;border-radius:50%;background:var(--busuublue-100);box-shadow:0 0 0 3px #cfe0fb}
  .timer{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink-r);line-height:1}
  .wave{display:flex;align-items:center;gap:3px;height:28px;flex:1}
  .wave i{flex:1;max-width:4px;border-radius:2px;background:var(--utilityred-100);opacity:.55}
  .micsel{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--row-border);background:#fff;font-size:12px;color:var(--text-secondary)}
  .steps{display:flex;flex-direction:column;gap:7px;margin:2px 0}
  .step{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--grey-r)}
  .step i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;border:2px solid var(--row-border);font-style:normal}
  .step.done{color:var(--ink-r)} .step.done i{background:var(--success);border-color:var(--success)}
  .step.on{color:var(--ink-r);font-weight:600} .step.on i{border-color:var(--busuublue-100);border-top-color:transparent;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bigscore{display:flex;align-items:baseline;gap:8px}
  .bigscore b{font-size:40px;font-weight:800;color:var(--busuublue-100);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .bigscore small{font-size:16px;color:var(--grey-r);font-weight:700}

  .day{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary);margin:6px 0 4px}
  .mrow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--row-border)}
  .day+.mrow{border-top:0}
  .mrow .tm{font-size:13px;font-weight:700;color:var(--text-secondary);font-variant-numeric:tabular-nums}
  .mrow .tm small{display:block;font-size:11px;font-weight:500;color:var(--grey-r)}
  .mrow .nm{font-size:13.5px;font-weight:600;color:var(--ink-r);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .mt{font-size:12px;color:var(--grey-r);margin-top:1px}
  .mrow.isnow .tm{color:var(--busuublue-100)}
  .bell{width:34px;height:34px;border-radius:8px;border:1px solid var(--row-border);background:#fff;display:grid;place-items:center;color:var(--grey-r)}
  .bell[aria-pressed="true"]{color:var(--busuublue-100);background:var(--busuublue-5);border-color:var(--busuublue-20)}
  .prow{display:grid;grid-template-columns:52px minmax(0,1fr) auto 30px;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%;background:none}
  .prow:hover{background:var(--neutral-5)}
  .prow.sel{background:var(--busuublue-5);border-color:var(--busuublue-20)}
  .prow .dt{font-size:12px;font-weight:700;color:var(--text-secondary);line-height:1.2}
  .prow .dt small{display:block;font-size:11px;font-weight:500;color:var(--grey-r)}
  .prow .nm{font-size:13.5px;font-weight:600;color:var(--ink-r);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .mt{font-size:12px;color:var(--grey-r)}
  .sc{display:inline-flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
  .sc b{font-size:17px;font-weight:800;color:var(--ink-r)}
  .sc .d{font-size:11.5px;font-weight:700}
  .d.up{color:var(--success-ink)} .d.dn{color:var(--amber-100)}
  .more{position:relative}
  .more>button{width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--grey-r);display:grid;place-items:center}
  .more>button:hover{background:#e9ecf0}
  .menu{position:absolute;right:0;top:32px;z-index:5;background:#fff;border-radius:10px;box-shadow:0 8px 24px -6px rgba(18,27,38,.28),0 0 0 1px var(--row-border);padding:6px;min-width:200px}
  .menu.up{top:auto;bottom:32px}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:8px 10px;font-size:13px}
  .menu button:hover{background:var(--neutral-5)}
  .menu small{display:block;font-size:11.5px;color:var(--grey-r);padding:2px 10px 6px}
  .prow.nofb{cursor:default}
  .prow-x{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:4px 0 2px 64px}
  .seg{display:inline-flex;background:#e9ecf0;border-radius:999px;padding:3px}
  .seg button{height:26px;border:0;border-radius:999px;background:none;font-size:12px;font-weight:700;color:var(--text-tertiary);padding:0 11px}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--ink-r);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text-primary);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);z-index:9}
  .toast button{background:none;border:0;color:#9cc3ff;font-weight:700;font-size:13px;padding:0}

  .notif{position:absolute;top:40px;right:14px;width:384px;z-index:10;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(244,247,252,.97));backdrop-filter:blur(14px);border-radius:20px;box-shadow:0 22px 48px -12px rgba(18,27,38,.45),0 0 0 .5px rgba(18,27,38,.14);overflow:hidden;color:var(--ink-r);animation:slidein .45s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes slidein{from{transform:translateX(30px);opacity:0}}
  .notif::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#116EEE,#5aa1ff 60%,#0EBE75)}
  .notif .in{padding:16px 16px 14px}
  .notif .hd{display:flex;align-items:center;gap:10px}
  .appic{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,#3d8bff,#116EEE 55%,#0b55c4);display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px -1px rgba(17,110,238,.5);flex-shrink:0}
  .notif .hd .nm{flex:1;font-size:12px;font-weight:700;color:var(--text-secondary);letter-spacing:.01em}
  .notif .hd .nm small{display:block;font-size:11px;font-weight:500;color:var(--grey-r)}
  .notif .hd time{font-size:11px;color:var(--grey-r)}
  .notif .live{display:inline-flex;align-items:center;gap:6px;margin-top:14px;height:22px;padding:0 9px 0 7px;border-radius:999px;background:var(--utilityred-5);color:var(--utilityred-100);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;box-shadow:inset 0 0 0 1px var(--utilityred-20)}
  .notif .live i{width:7px;height:7px;border-radius:50%;background:var(--utilityred-100);animation:pulse 1.4s infinite}
  .notif .tt{display:block;font-size:17px;font-weight:700;line-height:1.3;margin-top:8px;color:var(--text-primary)}
  .notif .mt{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--grey-r)}
  .notif .pb{display:inline-flex;align-items:center;gap:6px}
  .notif .pb b{width:18px;height:18px;border-radius:5px;background:#5b5fc7;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
  .avs{display:flex;margin-left:auto}
  .avs span{width:24px;height:24px;border-radius:50%;border:2px solid #fff;margin-left:-7px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
  .avs span.more{background:var(--neutral-5);color:var(--text-tertiary)}
  .notif .ac{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:16px}
  .notif .ac button{height:40px;border-radius:10px;border:0;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .notif .ac .p{background:var(--utilityred-100);color:#fff;box-shadow:0 4px 12px -4px rgba(226,34,46,.6)}
  .notif .ac .p:hover{background:#c81c27}
  .notif .ac .s{background:rgba(18,27,38,.06);color:var(--text-secondary)}
  .notif .ac .s:hover{background:rgba(18,27,38,.1)}
  .notif .ft{display:flex;align-items:center;gap:7px;padding:10px 16px;background:rgba(17,110,238,.06);border-top:1px solid rgba(17,110,238,.1);font-size:12px;color:var(--text-tertiary)}
  .notif .ft svg{color:var(--busuublue-100);flex-shrink:0}
  .notif-wrap .tag{position:absolute;top:-20px;right:6px;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#6d6d72}
  .notif-wrap{position:absolute;top:92px;right:14px;z-index:10}
  .notif-wrap .notif{position:relative;top:0;right:0}

  .mrow .mbtn{min-width:0;display:block}
  .uphint{margin:-4px 0 6px;font-size:12px;color:var(--grey-r)}
  .mrow .pbtn{margin-top:7px;height:28px;color:var(--cta,#116EEE);border-color:var(--busuublue-20,#cfe0fb);background:#fff}
  .mrow .noprac{display:block;margin-top:6px}
  .mrow .noprac{font-size:11.5px;color:var(--grey-r)}
  .mrow .mbtn:focus-visible{outline:2px solid var(--busuublue-100);outline-offset:2px}
  .mrow.open{background:var(--busuublue-5);border-radius:10px;border-top-color:transparent;padding-inline:10px;margin-inline:-6px}
  .mrow.open+.mrow{border-top-color:transparent}
  .mx{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;padding:2px 0 4px}
  .mx .who{font-size:12px;color:var(--grey-r)}
  .prep{display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;gap:10px 12px;background:#fff;border:1px solid var(--busuublue-20);border-radius:10px;padding:10px 12px}
  .prep .ic{width:32px;height:32px;border-radius:9px;background:var(--busuublue-100);display:grid;place-items:center;flex-shrink:0}
  .prep .tx{min-width:0}
  .prep .btn{grid-column:1/-1;justify-content:center}
  .prep b{display:block;font-size:13px;font-weight:700;color:var(--ink-r)}
  .prep small{display:block;font-size:11.5px;color:var(--grey-r)}
  .noprep{font-size:12px;color:var(--grey-r);font-style:italic}

  .pr{background:#fff}
  .rd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px;background:#fff;min-height:420px}
  .rd .rd-sp{width:56px;height:56px;border-radius:50%;border:5px solid #dbe7fb;border-top-color:#116EEE;animation:rdspin .9s linear infinite;margin-bottom:14px}
  @keyframes rdspin{to{transform:rotate(360deg)}}
  .rd h2{margin:0;font-size:24px;font-weight:700;color:#1b1f27}
  .rd p{margin:0;font-size:15px;color:#4b5563;max-width:460px;line-height:1.5}
  .rd p b{color:#1b1f27}
  .rd .rd-bar{width:260px;height:6px;border-radius:99px;background:#e5eaf2;overflow:hidden;margin-top:14px}
  .rd .rd-bar i{display:block;height:100%;width:0;background:#116EEE;border-radius:99px;animation:rdbar 2.3s ease-out forwards}
  @keyframes rdbar{to{width:100%}}
  .rd button{all:unset;cursor:pointer;margin-top:16px;font-size:13px;font-weight:700;color:#116EEE;text-decoration:underline}
  .ext{flex-shrink:0;opacity:.8}
  .pr-top{display:flex;align-items:center;justify-content:center;position:relative;padding:12px 24px 0;flex-shrink:0}
  .pr-x{position:absolute;left:20px;top:4px;width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--grey-r);display:flex;align-items:center;justify-content:center}
  .pr-x:hover{background:var(--neutral-5)}
  .pr-bar{width:500px;height:12px;border-radius:999px;background:#dde3ea;overflow:hidden}
  .pr-bar i{display:block;height:100%;background:var(--success);border-radius:999px;transition:width .3s}
  .pr-main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:36px 24px 24px}
  .pr-title{font-size:20px;font-weight:700;color:var(--text-primary)}
  .pr-goal{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary);margin-top:8px}
  .pr-from{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--grey-r);margin-top:10px}

  return '<div class="card"><div class="sec-h"><h3>Capability levels</h3><span class="aux">From '+scored().length+' calls</span></div><div class="cats">'+[1,2,3,4,5].map(i=>{
    const caps=capsIn(i).sort((a,b)=>(b.score??-1)-(a.score??-1)),s=catScore(i),open=S.openCat===i,cc='--cc:'+CATCOL[i][0]+';--ct:'+CATCOL[i][1],d=CAT_DELTA[i];
    return '<div class="cat'+(open?' open':'')+'" style="'+cc+'"><button class="cat-h" aria-expanded="'+open+'" onclick="act.cat('+i+')"><span class="cat-ic">'+i+'</span><span><span class="cat-nm">'+CATS[i]+'</span><span class="cat-n">'+caps.length+' heard · <span class="d '+(d>=0?'up':'dn')+'" style="font-weight:700">'+(d>=0?'↑ ':'↓ ')+Math.abs(d)+'</span> in 30 days</span></span>'+(s==null?'<span class="gs">Getting started</span>':lvMeter(s))+'<span class="chev">▶</span></button>'+
      (open?'<div class="cat-b">'+caps.map(c=>'<button class="caprow" aria-current="'+(S.cap===c.n)+'" onclick="act.cap(\''+esc(c.n)+'\')"><span class="cn">'+c.n+(c.cats.length>1?'<small>Also in '+c.cats.filter(x=>x!==i).map(x=>CATS[x]).join(', ')+'</small>':'')+'</span>'+
        (c.ready?lvMeter(c.score):'<span class="gs">Getting started</span>')+'<span class="chev">›</span></button>').join('')+'</div>':'')+'</div>';
  }).join('')+'</div></div>';
}
function capDetail(o){
  o=o||{};const c=CAPS.find(x=>x.n===S.cap)||CAPS.find(x=>x.n==='Explaining background and situation');
  const cc=CATCOL[c.cats[0]][0],seen=c.kcs.filter(k=>k[2]>0),unseen=c.kcs.filter(k=>!k[2]);
  const kc=k=>'<div class="kc" style="--cc:'+cc+'"><span class="kt">'+k[0]+'</span><span class="kn">'+k[1]+'<small>'+k[2]+' use'+(k[2]>1?'s':'')+' · '+k[3]+' went well</small></span>'+lvMeter(k[4])+'</div>';
  const mo=m=>{const call=callById(m[0]);return '<div class="mo"><span class="ic '+m[2]+'">'+(m[2]==='good'?I.check:I.bang)+'</span><span><div class="q">“'+esc(m[3])+'”</div><div class="w">'+(m[2]==='good'?'Went well':'To work on')+' · '+esc(call.t)+' · '+call.day.split(' ').slice(1).join(' ')+' at '+m[1]+'</div></span><a class="linkbtn" href="#" onclick="return openEval()" aria-label="Open this moment in the feedback">Open →</a></div>';};
  return (o.back?'<button class="cd-back" onclick="act.cap(null)">'+I.back+'All capabilities</button>':'')+
    '<div class="card"><div class="cd-hd"><div class="tx"><span class="lbl">Capability</span><h3>'+c.n+'</h3><div class="cd-cats">'+c.cats.map(x=>'<span class="cd-cat"><i style="background:'+CATCOL[x][0]+'"></i>'+CATS[x]+'</span>').join('')+'</div></div>'+
    '<div class="cd-score">'+(c.ready?'<span class="lvl-w">'+LEVELS[lvOf(c.score)]+'</span>'+lvMeter(c.score,{big:true,noLabel:true})+'<small>'+(lvOf(c.score)<2?'On the way to '+LEVELS[lvOf(c.score)+1]:'Top level')+'</small>':'<b style="font-size:18px;color:var(--grey-r)">Getting started</b><small>'+(MIN_MOMENTS-c.moms.length)+' more moment'+(MIN_MOMENTS-c.moms.length>1?'s':'')+' to get a level</small>')+'</div></div></div>'+
    '<div class="how"><b>How this level is built.</b> Each time you use this capability in a call, Companion notes which skills you used and whether they landed. Your level comes from the skills we’ve heard you use, from '+c.moms.length+' moments in '+c.calls+' call'+(c.calls>1?'s':'')+'. Skills you haven’t used in a call yet don’t count.</div>'+
    '<div class="card"><div class="sec-h"><h3>Skills</h3><span class="aux">'+seen.length+' of '+c.kcs.length+' heard in your calls</span></div>'+seen.map(kc).join('')+
      (unseen.length?'<div class="day" style="margin-top:10px">Not heard yet</div>'+unseen.map(k=>'<div class="kc unseen"><span class="kt">'+k[0]+'</span><span class="kn">'+k[1]+'</span><span></span></div>').join(''):'')+'</div>'+
    '<div class="card"><div class="sec-h"><h3>Moments from your calls</h3><span class="aux">'+c.moms.filter(m=>m[2]==='good').length+' went well · '+c.moms.filter(m=>m[2]==='fix').length+' to work on</span></div>'+c.moms.map(mo).join('')+'</div>';
}

function header(){
  return '<div class="db-hd"><img src="img/logo.svg" alt="Busuu Companion"><span></span>'+'<div class="rt"><button class="set">Settings</button><span class="av" aria-label="Jordan">J</span></div></div>';
}
function layoutB(){
  return '<div class="db-body" style="grid-template-columns:420px minmax(0,1fr)"><div class="col">'+nowCard()+upcoming({max:4})+past()+'</div><div class="col">'+
    (S.cap?capDetail({back:true}):trendCard({w:690,h:210,title:'Your communication score'})+categories())+'</div></div>';
}
function notif(){
  if(S.rec!=='prompt')return '';
  const u=UPCOMING[0],av=[['A','#7c3aed'],['A','#0d9488'],['P','#db2777'],['J','#f59e0b']];
  if(S.detect==='gen')return '<div class="notif-wrap"><div class="notif" role="alertdialog" aria-label="Meeting detected"><div class="in">'+
    '<div class="hd"><span class="appic">'+I.micW+'</span><span class="nm">Busuu Companion<small>Meeting detected</small></span><time>now</time></div>'+
    '<span class="live"><i></i>Microphone in use</span>'+
    '<span class="tt">Are you in a meeting?</span>'+
    '<div class="mt">Record it to get feedback on your English afterwards.</div>'+
    '<div class="ac"><button class="p" onclick="act.start()">'+I.rec+'Record this call</button><button class="s" onclick="act.skip()">Not this one</button></div></div>'+
    '<div class="ft">'+I.shield+'Let everyone know you’re recording.</div></div></div>';
  return '<div class="notif-wrap"><div class="notif" role="alertdialog" aria-label="Meeting started"><div class="in">'+
    '<div class="hd"><span class="appic">'+I.micW+'</span><span class="nm">Busuu Companion<small>Meeting detected in '+PLAT[u.plat][1]+'</small></span><time>now</time></div>'+
    '<span class="live"><i></i>Started 1 min ago</span>'+
    '<span class="tt">'+u.t+'</span>'+
    '<div class="mt"><span class="pb"><b>'+PLAT[u.plat][0]+'</b>'+u.tm+'–'+u.end+'</span><span class="avs">'+av.map(a=>'<span style="background:'+a[1]+'">'+a[0]+'</span>').join('')+'<span class="more">+2</span></span></div>'+
    '<div class="ac"><button class="p" onclick="act.start()">'+I.rec+'Record this call</button><button class="s" onclick="act.skip()">Not this one</button></div></div>'+
    '<div class="ft">'+I.shield+'Let everyone know you’re recording.</div></div></div>';
}

function practiceScreen(){
  if(S.redir){const u0=UPCOMING.find(x=>x.id===S.practice);return '<div class="chrome"><i></i><i></i><i></i><span>Redirecting to Busuu…</span></div><div class="cs pr"><div class="rd" role="status" aria-live="polite"><div class="rd-sp" aria-hidden="true"></div><h2>Redirecting to Busuu…</h2><p>Creating a custom scenario based on your meeting: <b>'+esc(u0.t)+'</b></p><div class="rd-bar"><i></i></div><button onclick="act.practice(null)">Cancel</button></div></div>';}
  const u=UPCOMING.find(x=>x.id===S.practice),p=PREP[u.id],done=S.pst==='done',lc=[1,2,3,4,5].map(i=>[i,catScore(i)]).sort((a,b)=>a[1]-b[1])[0][0];
  return '<div class="chrome"><i></i><i></i><i></i><span>Busuu · AI Conversations</span></div><div class="cs pr">'+
    '<div class="pr-top"><button class="pr-x" aria-label="Close and go back to the dashboard" onclick="act.practice(null)">'+I.x+'</button><div class="pr-bar" role="progressbar" aria-valuenow="'+(done?1:0)+'" aria-valuemax="3"><i style="width:'+(done?34:0)+'%"></i></div></div>'+
    '<div class="pr-main"><div class="pr-title">'+p.title+'</div><div class="pr-goal"><span aria-hidden="true">🎯</span>'+p.goal+'</div>'+
    '<div class="pr-from"><span class="pill p-blue">For '+esc(u.t)+' · '+u.g.split(' · ')[0]+' '+u.tm+'</span><span class="pill" style="background:'+CATCOL[lc][1]+';color:'+CATCOL[lc][0]+'">Builds on: '+CATS[lc]+'</span></div>'+
    '<div class="pr-chat"><div class="pr-ai">'+p.ai+'<br><button class="spk" aria-label="Play">'+I.spk+'</button></div>'+
    (done?'<div class="pr-me">'+p.me+'</div><span class="pr-fb"><span class="ck">'+I.check+'</span>'+p.fb+'</span>':'')+'</div></div>'+
    '<div class="pr-foot"><button class="pr-mic'+(S.pst==='rec'?' rec':'')+'" aria-label="'+(S.pst==='rec'?'Stop recording':'Record')+'" onclick="act.pmic()">'+I.micL+'</button><span class="pr-hint">'+(S.pst==='rec'?'Recording… click to stop':done?'Click to answer the next question':'Click to record your answer')+'</span></div></div>';
}

let tick=null;
function render(){
  const d=document.getElementById('device');if(!d)return;
    if(S.practice){clearInterval(tick);d.innerHTML=practiceScreen();fit();return;}
  const toast=S.toast?'<div class="toast" role="status">'+S.toast+'</div>':'';
  const keep=resetScroll?[]:[...d.querySelectorAll('.col,.pstack')].map(e=>e.scrollTop);resetScroll=false;
  d.innerHTML='<div class="cs">'+header()+layoutB()+notif()+toast+'</div>';
  d.querySelectorAll('.col,.pstack').forEach((e,i)=>{if(keep[i])e.scrollTop=keep[i];});
  wire();fit();
  clearInterval(tick);
  if(S.rec==='rec')tick=setInterval(()=>{S.secs++;['rectime','rectime2'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=fmt(S.secs);});},1000);
}
function wire(){
  const ch=document.getElementById('chart');if(!ch)return;
  const tip=document.getElementById('tip'),xh=document.getElementById('xh'),sc=scored();
  ch.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('mouseenter',()=>{
      const x=+r.getAttribute('x')+(+r.getAttribute('width'))/2;
      xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
      if(r.dataset.u){const u=UPCOMING.find(x=>x.id===r.dataset.u);tip.innerHTML='<b>'+esc(u.t)+'</b><div>'+u.g.split(' · ')[0]+' '+u.tm+' · '+(S.prompt[u.id]?'We’ll ask you to record':'No reminder')+'</div>';}
      else{const c=sc[+r.dataset.i],dn=S.dim&&DIMS.find(d=>d[0]===S.dim)[1];
        tip.innerHTML='<b>'+esc(c.t)+'</b><div style="color:#aab4c3;margin-bottom:4px">'+c.day+' · '+c.len+' min</div><div class="r"><span><span class="k"></span>Overall</span><b>'+ov(c)+'</b></div>'+(S.dim?'<div class="r"><span><span class="k dm"></span>'+dn+'</span><b>'+c.dims[S.dim]+'</b></div>':'')+'<div style="color:#aab4c3;margin-top:4px">Click to select this call</div>';}
      tip.hidden=false;tip.style.left=x+'px';tip.style.top='40px';
    });
    r.addEventListener('mouseleave',()=>{tip.hidden=true;xh.setAttribute('visibility','hidden');});
  });
}

let rdT=null;
const act={
  tab:t=>{S.tab=t;S.menu=null;render();},
  detect:()=>{S.rec='prompt';render();},
  start:()=>{S.rec='rec';S.secs=0;S.toast=null;render();},
  skip:()=>{S.rec='idle';S.toast='Okay, we won’t record this call.';render();setTimeout(()=>{S.toast=null;render();},2600);},
  stop:()=>{S.rec='proc';S.tab='meet';S.sel=null;render();clearTimeout(procT);procT=setTimeout(()=>{if(S.rec==='proc')act.done();},ANALYSE_MS);},
  cancel:()=>{S.rec='idle';S.toast='Recording cancelled and deleted.';render();setTimeout(()=>{S.toast=null;render();},2600);},
  done:()=>{S.rec='ready';S.sel=NEWCALL.id;render();},
  toProgress:()=>{S.tab='prog';S.cap=null;render();},
  detect_:k=>{S.detect=k;render();},
  bell:id=>{S.prompt[id]=!S.prompt[id];render();},
  up:id=>{S.upSel=S.upSel===id?null:id;render();},
  practice:id=>{S.practice=id;S.pst='idle';clearTimeout(rdT);S.redir=!!id;if(id)rdT=setTimeout(()=>{if(S.practice===id&&S.redir){S.redir=false;render();}},2400);render();},
  pmic:()=>{S.pst=S.pst==='rec'?'done':S.pst==='done'?'done':'rec';render();},
  sel:id=>{S.sel=S.sel===id?null:id;S.menu=null;render();},
  menu:id=>{S.menu=S.menu===id?null:id;render();},
  archive:id=>{const a=S.archived.includes(id);S.archived=a?S.archived.filter(x=>x!==id):S.archived.concat(id);S.menu=null;if(S.sel===id)S.sel=null;
    const c=callById(id);S.toast=a?'Unarchived “'+esc(c.t)+'”':'Archived “'+esc(c.t)+'”. It no longer counts toward your progress. <button onclick="act.archive(\''+id+'\')">Undo</button>';render();clearTimeout(act._t);act._t=setTimeout(()=>{S.toast=null;render();},5000);},
  pv:v=>{S.pastView=v;S.menu=null;render();},
  dim:k=>{S.dim=k;render();},
  cat:i=>{S.openCat=S.openCat===i?null:i;render();},
  cap:n=>{S.cap=n;if(n)S.tab='prog';render();}
};
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('.more')){S.menu=null;render();}});

const STEPS={
 home:()=>({practice:null,upSel:null,rec:'idle',tab:'meet',cap:null,dim:null,sel:null,toast:null}),
 prog:()=>({practice:null,upSel:null,rec:'ready',tab:'prog',cap:null,dim:'flu',sel:null,openCat:4,toast:null})
};
const ANALYSE_MS=6500;
let procT=null,resetScroll=false;
function toggleNotif(){
  if(S.practice||S.menu)return;
  if(S.rec==='idle')act.detect();
  else if(S.rec==='prompt'){S.rec='idle';render();}
}
function go(id){
  clearTimeout(procT);resetScroll=true;Object.assign(S,STEPS[id]());render();
  requestAnimationFrame(fit);setTimeout(fit,60);
}
const stage=document.getElementById('stage');
stage.innerHTML='<div class="devwrap" id="devwrap"><div class="device" id="device"></div></div>';
window.addEventListener('message',e=>{
  if(e.source!==window.parent||!e.data)return;
  if(e.data.notif){toggleNotif();return;}
  if(STEPS[e.data.step])go(e.data.step);
});
document.addEventListener('keydown',e=>{
  if(e.code==='KeyN'&&e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'')){e.preventDefault();toggleNotif();}
});
function fit(){
  const d=document.getElementById('device');if(!d||!d.offsetWidth)return;
  const M=Math.min(24,innerWidth*.02),s=Math.min((innerWidth-2*M)/d.offsetWidth,(innerHeight-2*M)/d.offsetHeight);
  d.style.transform='scale('+s+')';d.style.left=Math.max(0,(innerWidth-d.offsetWidth*s)/2)+'px';d.style.top=Math.max(0,(innerHeight-d.offsetHeight*s)/2)+'px';
}
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(document.documentElement);
{const hs=location.hash.slice(1);go(hs.startsWith('step:')&&STEPS[hs.slice(5)]?hs.slice(5):'home');}
</script>

</body></html>
