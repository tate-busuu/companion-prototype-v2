<style>

const T_FULL=[{"who":"Maya","x":"Hi, how are you?","m":0.05,"t":"00:03","id":"f1"},{"who":"you","x":"Hey Maya, how’s it going?","m":0.08,"t":"00:05","id":"f2"},{"who":"Maya","x":"Good, thanks. Is Daniel joining us?","m":0.13,"t":"00:08","id":"f3"},{"who":"you","x":"Yes, he should be here in a minute.","m":0.18,"t":"00:11","id":"f4"},{"who":"Maya","x":"Okay. And how was your weekend?","m":0.42,"t":"00:25","id":"f5"},{"who":"you","x":"Pretty good. Well, we were— we were supposed to go hiking, but it rained the whole time. So we, uh, we just stayed in and cooked.","m":0.47,"t":"00:28","id":"m1","k":"good","ax":"rel","cap":"Maintaining relationships","why":"You shared a personal detail and fixed your own sentence mid-way without losing the thread."},{"who":"Maya","x":"Oh, that sounds nice anyway. Shall we get started?","m":0.75,"t":"00:45","id":"f6"},{"who":"you","x":"Sure, yes. Let’s do it.","m":0.83,"t":"00:50","id":"f7"},{"who":"Daniel","x":"Hi both, sorry I’m late.","m":1.08,"t":"01:05","id":"f8"},{"who":"Maya","x":"No problem, we were just starting.","m":1.17,"t":"01:10","id":"f9"},{"who":"Maya","x":"So I wanted to see where you are with the offsite plan, before we send the save-the-date to the whole team. Can you walk us through what’s booked?","m":2.28,"t":"02:17","id":"f10"},{"who":"you","x":"Sure. Yeah. All right. So let me take the points in order. So first off, the venue. <mark>I regret not booking earlier in the summer, because the first place we looked at filled up, and we had to start the search again from scratch.</mark> It was a bit of a scramble. It was just that all the good places were taken. That’s completely done now. We have a place in the hills, about ninety minutes by train from the office. It sleeps forty-five, and it has two meeting rooms and a big kitchen. Is the whole group coming from the main office? Okay, mostly the main office. So I’ve shared the booking confirmation with you in the chat of this meeting. I have another one in Spanish if that would be helpful for the Madrid team. We have the schedule in Spanish and we can do it in any other language. It’s just a machine translation.","m":2.43,"t":"02:26","id":"m3","k":"fix","ax":"cla","cap":"Explaining and clarifying","why":"Good opener, then the story about the first venue came before what Maya asked: what is booked now.","better":"The venue is booked: a place in the hills, 90 minutes by train, with room for 45.","nx":"struct"},{"who":"Maya","x":"Great, thank you. That’s a lot further along than I expected.","m":3.17,"t":"03:10","id":"f11"},{"who":"Daniel","x":"Is there parking, for the people who drive?","m":3.67,"t":"03:40","id":"f12"},{"who":"you","x":"Yes, there’s a car park for about twenty cars. I’ll send the details with the invite.","m":3.83,"t":"03:50","id":"f13"},{"who":"Maya","x":"Perfect.","m":4.5,"t":"04:30","id":"f14"},{"who":"Maya","x":"Send me the schedule once it’s done and I’ll do a first check. Then I’ll ask Daniel to give it his final seal of approval next week when we have our catch-up. Is there anything else I should know?","m":5.43,"t":"05:26","id":"f15"},{"who":"you","x":"Sure. Okay, yeah, no problem. There is one, one sticky part that I’ll raise just so you’re aware when you’re talking to the team. It’s the train on the Friday morning. So this is something with the rail line where, um, <mark>there are engineering works on that route, so some trains get cancelled or replaced by buses for a few hours.</mark> It’s not every train. Normally it runs every half hour, but on that morning it could be every hour, and part of the way is by bus. So that’s something we need to make people aware of. Nothing is cancelled outright. It’s just a delay that the rail company has announced, and they haven’t said exactly which trains are affected yet.","m":5.63,"t":"05:38","id":"m5","k":"fix","ax":"flu","cap":"Dealing with problems and incidents","why":"Several restarts before the point. Say the warning in one line, then the detail.","better":"One heads-up: there are engineering works on the Friday morning line. Some trains will be buses, so leave an hour early.","nx":"warn"},{"who":"Maya","x":"Okay, that’s useful. We’ll put a line about it in the invite.","m":6.83,"t":"06:50","id":"f16"},{"who":"Daniel","x":"The budget will have to go through finance before we can pay the deposit, so that could take a while.","m":7.58,"t":"07:35","id":"f17"},{"who":"you","x":"Right. I mean, I’m not in the conversations that you are, but my sense is, okay, we have a venue, it needs a deposit, it’s going to go through finance, then through approvals. And that’s really what I’m trying to understand: what are the steps that need to happen?","m":7.77,"t":"07:46","id":"m6","k":"good","ax":"rel","cap":"Giving an opinion","why":"You tied Daniel’s point back to the goal of getting the booking confirmed."},{"who":"Maya","x":"That makes sense.","m":8.33,"t":"08:20","id":"f18"},{"who":"Maya","x":"Okay, and so once we’re there, is lunch included, or do people sort out their own food on the first day?","m":9.1,"t":"09:06","id":"f19"},{"who":"you","x":"So for now people sort out their own lunch on the first day. Having the venue provide it would mean agreeing a menu in advance, and that would be a whole extra step. So right now it’s just breakfast and dinner that are included. One of the risks that we know about, and it may come up, and it’s good to get more feedback on, is that people have different dietary needs. We see that a lot. Even in our own team we think, oh no, I forgot that one. So we’re aware that’s going to happen, and <mark>it’s something that’s on. Well, we will.</mark>","m":9.35,"t":"09:21","id":"n1","k":"fix","ax":"cla","cap":"Explaining and clarifying","why":"The answer trailed off at the end. Close on the point you want her to pass on.","better":"For now people sort out their own lunch on day one. We know diets vary, so I’ll ask everyone to send theirs in.","nx":"struct"},{"who":"Daniel","x":"That’s a fair risk. Good to know.","m":10.08,"t":"10:05","id":"f20"},{"who":"Maya","x":"And does the price include a room for everybody, or only for some people?","m":10.48,"t":"10:29","id":"f21"},{"who":"you","x":"Okay. So, for now, just shared rooms. We’ve had feedback from the sales team and the support team that sharing a room isn’t going to work for a lot of people. So we’re working right now on upgrading some of them to single rooms. <mark>works right now and the booking that we’re— and the booking that we’d be confirming</mark> in the next couple of weeks is shared rooms.","m":10.55,"t":"10:33","id":"m7","k":"fix","ax":"gra","cap":"Explaining background and situation","why":"Two sentences ran into each other, so the key fact (it’s shared rooms today) got lost.","better":"Right now it’s shared rooms only. We’re working on upgrading some to single rooms.","nx":"struct"},{"who":"Maya","x":"Okay, and what about cost? If someone wants a single room, is the company paying for that, or do they pay the difference?","m":11.4,"t":"11:24","id":"f22"},{"who":"you","x":"Yes, the company pays. We’ve built that into the budget. For the first night, single rooms are covered for anyone who asks. Then there are a few more details. If someone wants to bring a guest, they cover the guest’s cost themselves. And there’s a limit on the number of single rooms, which finance asked us to include.","m":11.78,"t":"11:47","id":"m8","k":"good","ax":"cla","cap":"Explaining and clarifying","why":"A direct yes first, then the evidence. Easy to follow."},{"who":"Daniel","x":"That’s reassuring.","m":12.33,"t":"12:20","id":"f23"},{"who":"Maya","x":"But people won’t know that unless we tell them. When I book a trip, there’s always a form that asks if I need anything.","m":12.77,"t":"12:46","id":"f24"},{"who":"you","x":"No. Have you used a hotel booking app where you add your preferences? Okay, so it’s very similar to that. People fill it in on their phone, and the venue doesn’t see anything until we send it over. You could be filling one in right now and I wouldn’t know. So the way we handle it is we send one form and say it’s up to each person to fill it in. It’s similar here. There are reminders, and a link in every message, but people can mute them, because it gets a bit repetitive.","m":13.08,"t":"13:05","id":"m10","k":"good","ax":"rel","cap":"Supporting a point","why":"A comparison she already knew made a tricky point easy to accept."},{"who":"Maya","x":"Okay, so if we carry on as if I’m booking my own seat, is there a limit on how many people can come? It used to be 40. I don’t know whether that’s changed.","m":14.42,"t":"14:25","id":"f25"},{"who":"you","x":"Just so we have something to look at. No, the limit is 45 now.","m":14.65,"t":"14:39","id":"n2","k":"good","ax":"cla","cap":"Explaining and clarifying","why":"A short, direct answer to a factual question."},{"who":"Maya","x":"Okay, and then what happens? Then we get the schedule. Talk me through what happens next.","m":15.4,"t":"15:24","id":"f26"},{"who":"you","x":"And you get the schedule. <mark>It’s, it’s going out, it’s, these are—</mark> our designer has given us some little cards here, but it’s going to go out through the HR system. If they have questions about allergies, I think, Daniel, there’s a document about how those are collected, and what the arrangements are with the caterer and all of that. I don’t know if you have that handy to share, but it’s all documented.","m":15.5,"t":"15:30","id":"n3","k":"fix","ax":"flu","cap":"Explaining background and situation","why":"Several half-started ideas in one turn. Say what happens next, then where to find the detail.","better":"Then the schedule goes out to everyone. If they ask about allergies, Daniel has a document on how those are handled.","nx":"struct"},{"who":"Daniel","x":"Yes, it’s in the shared folder. At the bottom I list the page where the allergy section starts.","m":16.17,"t":"16:10","id":"f27"},{"who":"you","x":"All the fields. And then the final thing is the agenda. This is going to change quite a lot. We got a lot of comments from last year’s attendees about how packed it was, and this is only a one-hour slot, so it doesn’t really leave room for anything else. But it’s going to change quite a lot in the coming weeks. How people get there and the accommodation won’t change, but what’s on the agenda will. So we can let you know when that happens, and if you want to give people a heads-up that we’re making changes based on feedback.","m":16.28,"t":"16:17","id":"n4","k":"good","ax":"rel","cap":"Reporting and summarising","why":"You flagged that the agenda will change before she heard it from a team lead."},{"who":"Daniel","x":"My worry is changes close to the date. If the agenda keeps moving, people might get confused.","m":17.67,"t":"17:40","id":"f28"},{"who":"Maya","x":"Yes, we’d need some warning, so we can plan around it.","m":18.33,"t":"18:20","id":"f29"},{"who":"you","x":"And I’m happy to, you know, Maya, <mark>maybe we just need to set up like, here’s like, if anything is going to change, I give you X, I give you one week’s notice, X amount of time</mark> so that you can manage the comms. But the idea is moving quickly on the feedback that we’re getting.","m":18.57,"t":"18:34","id":"m9","k":"fix","ax":"rel","cap":"Making requests and offers","why":"Your proposal was good but hard to pick out. Make it one clear question she can say yes to.","better":"Could we agree I give you a week’s notice before any change, so you can manage the comms?","nx":"req"},{"who":"Daniel","x":"One option is a little “what’s new” note in the invite whenever something changes.","m":19.77,"t":"19:46","id":"f30"},{"who":"you","x":"The email that goes out says, here’s the new version, check the details. They check it and then they have all the updates. I think it’s a good idea what you just said, Daniel, to have some kind of changelog.","m":19.8,"t":"19:48","id":"m11","k":"good","ax":"rel","cap":"Agreeing and disagreeing","why":"You named Daniel and credited his idea. That keeps people bringing ideas."},{"who":"Maya","x":"Okay, so we still get feedback, it’s just not on the very latest plan. Um, have we got any team leads confirmed yet for the sessions? Has anyone shown interest?","m":20.3,"t":"20:18","id":"f31"},{"who":"you","x":"<mark>Um, someone from marketing has shown some interest. Um, I’m trying to set up a call with them along with Daniel,</mark> um, and then there’s yours. We don’t have anyone committed yet, but we have a couple.","m":20.53,"t":"20:32","id":"m4","k":"fix","ax":"cla","cap":"Reporting and summarising","why":"She asked a yes-or-no question. Your “not yet” came last, after the names.","better":"Not yet. Marketing is interested, and I’m setting up a call with them and Daniel.","nx":"stat"},{"who":"Maya","x":"Going back to what Daniel said, is it worth holding off on the agenda for a few weeks until it’s more settled? Or is there pressure on your side to get going now?","m":21.1,"t":"21:06","id":"f32"},{"who":"you","x":"<mark>Yeah, I think, yeah, I think that’s, that’s, that’s the point. I, I am anticipating</mark> that this is going to take several weeks to pin down. Even after the first conversations, it’ll take a while before anybody has actually signed up for a session. So the sooner we get going, the better. By the time people register, it’ll probably already have the new timings and all the updates anyway. So for the speakers, I’d go ahead and get them started, and that way we can get feedback on, hey, this slot doesn’t work, and then we can fix that part rather than waiting. And we’re looking at other ways to get feedback on the agenda, like a short survey, or just asking a few people. Because originally I don’t think we realised how long it would take to fill the sessions, and if we wait for that before getting feedback, we’re wasting time. So really the main goal right now is: can we fill the sessions? Can we get the speakers confirmed?","m":21.43,"t":"21:26","id":"m12","k":"fix","ax":"flu","cap":"Giving an opinion","why":"Your recommendation (“start now”) came at the very end of a long turn. Open with it, then give the reason.","better":"I’d start now. Confirming speakers will take weeks, and by then the timings will be settled.","nx":"opin"},{"who":"Maya","x":"All right. That’s helpful.","m":22.67,"t":"22:40","id":"f33"},{"who":"Maya","x":"The only restriction on the venue’s side is that the kitchen staff aren’t very confident with English, so we’ll need to lean on their manager, Ravi, quite a lot.","m":23.2,"t":"23:12","id":"f34"},{"who":"you","x":"Mm-hmm. I think so. He’s very keen on this and wants it to go well, so I think he’ll put in as much time as it takes. You said the staff aren’t very confident in English. Are they the ones who would be serving, who would be talking to the guests?","m":23.5,"t":"23:30","id":"n8","k":"good","ax":"cla","cap":"Explaining and clarifying","why":"You checked who would actually deal with guests before assuming."},{"who":"Daniel","x":"Yes, just two people on the evening shift.","m":24.17,"t":"24:10","id":"f35"},{"who":"Maya","x":"They might just say they can’t do the late dinner, and that’s fine. It’s only one evening, so the impact is quite limited. As long as it’s planned and communicated properly, I’m happy to go ahead.","m":25.45,"t":"25:27","id":"f36"},{"who":"you","x":"Yeah. <mark>Only thing I’d ask is, if that happens, that’s good information for us. In my mind that’s useful</mark> because we understand what stops them. So just record that, and if you can dig a little deeper and share with us what is stopping them. Is it just, hey, a late dinner is a non-starter, it’s a hard no? Or is there something deeper? Understanding it as much as we can is important.","m":26.25,"t":"26:15","id":"n7","k":"fix","ax":"rel","cap":"Making requests and offers","why":"Your request came after a lot of build-up. Put the ask first.","better":"One request: if they say no, could you find out exactly why and share it with us?","nx":"req"},{"who":"Maya","x":"Understood. And how should we frame it with the team?","m":27.08,"t":"27:05","id":"f37"},{"who":"you","x":"That’s fair, that’s what we need to find out. And about the framing, yes, absolutely. I’ll leave it to you. At any point, if you feel we should cancel it, if this is a risk to the budget, please, no hard feelings. That comes first. I don’t want anything you do to be put at risk. The framing is that this is a first draft of the plan that we’re exploring and we’re just trying to get some feedback on it. It’s not the final form of what it will look like. We’re trying to get feedback to inform what comes next. And as much as you want to frame it as the team shaping an offsite they’re going to attend, I think that’s a good framing too.","m":27.2,"t":"27:12","id":"m13","k":"good","ax":"rel","cap":"Maintaining relationships","why":"You gave Maya clear permission to cancel the plan. That builds trust with a nervous stakeholder."},{"who":"Maya","x":"Okay, that seems fair. Oh, and if this goes well and you make the changes, when do you see it becoming a yearly event?","m":28.17,"t":"28:10","id":"f38"},{"who":"you","x":"Our plan right now, or <mark>the OKRs and everything we have</mark> for the rest of this year, are just about proving the idea. So adjusting the agenda, trying it out with real people, getting their feedback, making changes, and just understanding.","m":28.4,"t":"28:24","id":"n6","k":"fix","ax":"voc","cap":"Explaining background and situation","why":"“OKRs” is internal shorthand that colleagues in other teams may not use.","better":"This year our goal is to prove the idea: do people find it valuable, and can we afford to repeat it?","nx":"reg"},{"who":"Maya","x":"Yes. To me it makes common sense, because you want it close to the office, in the flow of work, right? I think the real power would be somewhere with its own conference space.","m":29.62,"t":"29:37","id":"f39"},{"who":"you","x":"Yeah, absolutely, that’s on the table. And it solves a lot of problems for us as well if we could do that. It’s just a bigger hurdle to get over. The question right now is, whatever way we’re running the day, is what we’re doing with it valuable? That’s the question. This is just the cheapest way we can get that without going through the whole procurement process, which is <mark>pretty lame</mark>.","m":29.78,"t":"29:47","id":"m14","k":"fix","ax":"voc","cap":"Explaining background and situation","why":"“Pretty lame” is very casual for a cross-team call. A neutral phrase sounds more considered.","better":"…without the whole procurement process, which is a much bigger lift.","nx":"reg"},{"who":"Maya","x":"Great. I think we’re in a good place.","m":31.17,"t":"31:10","id":"f40"},{"who":"Maya","x":"Okay. But will the single rooms be just for that person, or for everybody who asks?","m":32.37,"t":"32:22","id":"f41"},{"who":"you","x":"Yeah, it would be everybody who asks.","m":32.48,"t":"32:29","id":"n5","k":"good","ax":"cla","cap":"Explaining and clarifying","why":"A direct answer to a sensitive question, with no hedging."},{"who":"Daniel","x":"Thanks, you two. All right.","m":33.5,"t":"33:30","id":"f42"},{"who":"you","x":"Just, just wait. So I have a call with Ravi and the venue next week, so I can pass that on then.","m":33.53,"t":"33:32","id":"n10","k":"good","ax":"rel","cap":"Scheduling and coordinating","why":"You caught a possible mix-up before the call ended."},{"who":"Maya","x":"Thanks for spending the time with me today. It’s been really useful.","m":34.33,"t":"34:20","id":"f43"},{"who":"you","x":"Thank you both. Speak soon.","m":34.5,"t":"34:30","id":"f44"}];
let T=T_FULL;
let MOM=T.filter(t=>t.k);
const byId=id=>T.find(t=>t.id===id);

const S={variant:'E',openCats:[4],practice:null,breakdown:false,filter:null,drawer:null,ctx:null,flash:null,mode:'moments',scrollTo:null,asked:null};

function inFilter(m){
  if(!S.filter)return true;
  if(S.filter.startsWith('cap:'))return m.cap===S.filter.slice(4);
  return m.ax===CEFR[S.filter].ax;
}
function filterLabel(){
  if(!S.filter)return '';
  if(S.filter.startsWith('cap:'))return S.filter.slice(4);
  return CEFR[S.filter].n+' '+CEFR[S.filter].l+'/100';
}

const nextOf=t=>[L[t.nx],C[t.nx]];
const capLead=()=>false;
function glanceC(){
  const ks=Object.keys(CEFR),overall=Math.round(ks.reduce((a,k)=>a+CEFR[k].l,0)/ks.length),open=S.breakdown;
  const rows=ks.map(k=>{const d=CEFR[k];
    return '<div class="dimrow"><span><b>'+d.n+'</b><small>'+d.d+'</small></span><span class="lvl'+(d.l>=60?' up':'')+'">'+d.l+'</span></div>';}).join('');
  return '<div class="card"><div class="c-h">Your communication score for this call</div>'+
    '<div class="cefr-top" style="margin-top:10px"><span class="cefr-big">'+overall+'<small style="font-size:20px;color:var(--grey-r);font-weight:700">/100</small></span><span class="c-sub" style="margin:0">Confident and natural. Long answers sometimes hide the main point.</span></div>'+
    '<div class="scale"><div class="bar100"><i style="width:'+overall+'%"></i></div>'+
    '<div class="mk" style="left:calc('+overall+'% - 2px)"></div>'+
    '<div class="lb five">'+[0,25,50,75,100].map(n=>'<span>'+n+'</span>').join('')+'</div></div>'+
    '<button class="brk" aria-expanded="'+!!open+'" onclick="act.breakdown()"><span class="chev">▶</span>What makes up this score</button>'+
    (open?'<div class="brows dims"><div class="bnote">Each is scored across the whole call. Your score is the average of the five.</div>'+rows+'</div>':'')+
    '<div class="hint" style="margin-top:8px">A score for this call only, not a placement result.</div></div>';
}

function lessonBtn(k,cls){return '<button class="nx'+(cls?' '+cls:'')+'"'+(cls?' title="Opens AI conversations in Busuu"':'')+' onclick="act.noop()"><span class="ic">'+(cls?I.chat:I.play)+'</span><span><b>'+(cls?C[k][0]:L[k][0])+'</b><small>'+(cls?C[k][1]+' · opens in Busuu':L[k][1])+'</small></span>'+(cls?I.ext:'')+'</button>';}
const CATS={1:'Presenting and conveying ideas',2:'Engaging in conversation',3:'Making and responding to requests',4:'Explaining a decision',5:'Building rapport'};
const CAP_CAT={'Giving an opinion':1,'Supporting a point':1,'Explaining and clarifying':1,
  'Agreeing and disagreeing':2,'Managing discussion':2,
  'Making requests and offers':3,'Dealing with problems and incidents':3,'Scheduling and coordinating':3,
  'Reporting and summarising':4,'Explaining background and situation':4,
  'Maintaining relationships':5};
const MOMENT_CAT={m8:2}; /* answering the cost question = Giving clarification (category 2) */
const catOf=m=>MOMENT_CAT[m.id]||CAP_CAT[m.cap];
const CATCOL={1:['#116EEE','#f1f6fe'],2:['#7c3aed','#f6f2fe'],3:['#0d9488','#eefaf8'],4:['#db2777','#fdf2f7'],5:['#475569','#f2f4f7']};
function delta(up,dn){return '<span class="delta">'+(up?'<span class="up">↑ '+up+'</span>':'')+(dn?'<span class="dn">↓ '+dn+'</span>':'')+'</span>';}
const FOCUS_CAP='Explaining background and situation';
function focusStrip(){
  const ms=MOM.filter(m=>m.cap===FOCUS_CAP),fx=ms.filter(m=>m.k==='fix'),gd=ms.length-fx.length,allFix=MOM.filter(m=>m.k==='fix').length;
  const on=S.filter==='cap:'+FOCUS_CAP;
  return '<div class="fq" role="button" tabindex="0" aria-label="Your focus: '+FOCUS_CAP+'. Go to the first moment" onclick="act.focusGo()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();act.focusGo();}"><span class="fq-k">Your focus</span>'+
    '<span class="fq-n">'+FOCUS_CAP+'</span>'+
    '<span class="fq-t">Say where things stand now, then give the backstory.</span>'+
    '<button class="nlink fq-p" title="'+L.struct[0]+' · '+L.struct[1]+'" onclick="event.stopPropagation()">'+I.playb+'Study on Busuu</button></div>';
}
function capsBody(){
  const cats={};
  MOM.forEach(m=>{const c=catOf(m),g=cats[c]||(cats[c]={up:0,dn:0,caps:{}});
    const k=g.caps[m.cap]||(g.caps[m.cap]={up:0,dn:0});
    if(m.k==='good'){g.up++;k.up++;}else{g.dn++;k.dn++;}});
  const body=Object.keys(CATS).map(Number).map(i=>{
    const g=cats[i],open=S.openCats.includes(i);
    const cc='--cc:'+CATCOL[i][0]+';--ct:'+CATCOL[i][1];
    if(!g)return '<div class="cat none"><div class="cat-h"><span class="cat-ic">'+i+'</span><span class="cat-tx"><span class="cat-nm">'+CATS[i]+'</span><span class="n">Not in this call</span></span></div></div>';
    const n=Object.keys(g.caps).length;
    const rows=Object.entries(g.caps).sort((x,y)=>(y[1].up-y[1].dn)-(x[1].up-x[1].dn)).map(([cap,d])=>{const k='cap:'+cap;
      return '<button class="caprow" aria-pressed="'+(S.filter===k)+'" onclick="act.glance(\''+k+'\')"><span><b>'+cap+'</b></span>'+delta(d.up,d.dn)+'</button>';}).join('');
    return '<div class="cat'+(open?' open':'')+'" style="'+cc+'"><button class="cat-h" aria-expanded="'+open+'" onclick="act.cat('+i+')"><span class="cat-ic">'+i+'</span><span class="cat-tx"><span class="cat-nm">'+CATS[i]+'</span><span class="n">'+n+' capabilit'+(n===1?'y':'ies')+' in this call</span></span>'+delta(g.up,g.dn)+'<span class="chev">›</span></button>'+
      (open?'<div class="cat-b">'+rows+'</div>':'')+'</div>';
  }).join('');
  return '<div class="c-h">Your capabilities in this call</div>'+
    '<div class="cats">'+body+'</div>'+
    '<div class="hint" style="margin-top:8px">Tap a capability to see its moments.</div>';
}
function focusCard(){return '<div class="card">'+focusStrip()+'<div style="margin-top:24px">'+capsBody()+'</div></div>';}
function rating(){
  return '<div class="rating"><div class="q">Was this feedback helpful?</div><div class="th"><button aria-label="Thumbs up" onclick="act.noop()">👍</button><button aria-label="Thumbs down" onclick="act.noop()">👎</button></div>'+
    '<textarea id="rate-comment" placeholder="Add an optional comment…" maxlength="500"></textarea><div class="ct">0/500</div><button class="sub" disabled>Submit feedback</button></div>';
}

function visibleTurns(){
  if(S.mode==='all')return T;
  const keep=new Set();
  T.forEach((t,i)=>{if(t.k){keep.add(t.id);const p=T[i-1];if(p&&p.who!=='you')keep.add(p.id);}});
  return T.filter(t=>keep.has(t.id));
}
function turnHTML(t){
  const nm=t.who==='you'?'You':t.who;
  const dim=S.filter&&!(t.k&&inFilter(t))?' dim':'';
  const fl=S.flash===t.id?' flash':'';
  const head='<span class="nm">'+nm+'<time>'+t.t+'</time></span>';
  if(t.who!=='you')return '<div class="row them'+dim+fl+'" data-id="'+t.id+'">'+head+'<div class="b-them">'+t.x+'</div></div>';
  const ask='<button class="askic" title="Ask about this" aria-label="Ask about this turn" onclick="act.ask(\''+t.id+'\')">'+I.askic+'</button>';
  if(!t.k)return '<div class="row you'+dim+fl+'" data-id="'+t.id+'">'+head+'<div class="b-you">'+t.x+'</div><div class="under">'+ask+'</div></div>';
  const cl=capLead(),caph=cl?'<div class="caph"><b>'+t.cap+'</b><span class="dimn"><b>'+AXN[t.ax]+'</b> · '+DIMNOTE[t.id]+'</span></div>':'',
    pill=cl?'':'<span class="pill p-cap">'+t.cap+'</span>',nx=nextOf(t);
  if(t.k==='good'){
    return '<div class="row you'+dim+fl+'" data-id="'+t.id+'">'+head+
      '<div class="fixc goodc">'+caph+'<div class="orig">'+I.check+'<span>'+t.x+'</span></div>'+
      '<p class="ex"><b class="wl">Went well.</b> '+t.why+'</p>'+
      '<div class="meta">'+pill+ask.replace('askic','askic push')+'</div></div></div>';
  }
  return '<div class="row you'+dim+fl+'" data-id="'+t.id+'">'+head+
    '<div class="fixc">'+caph+'<div class="orig"><span class="ast">*</span><span>'+t.x+'</span></div>'+
    '<div class="cor">'+t.better+'</div><p class="ex">'+t.why+'</p>'+
    '<div class="meta">'+pill+
    '<button class="nlink" title="'+nx[0][0]+' · '+nx[0][1]+'" onclick="act.noop()">'+I.playb+'Study on Busuu</button>'+
    '<button class="nlink" title="Opens AI conversations in Busuu · '+nx[1][0]+' · '+nx[1][1]+'" onclick="act.practice(\'start\')">Practise with AI conversations'+I.ext+'</button>'+
    ask.replace('askic','askic push')+'</div></div></div>';
}
function mapHTML(){
  const H=520,top=18,y=m=>top+m/MEETING.len*H;
  let h='<div class="ln"></div>';
  [0,10,20,30].forEach(v=>{h+='<span style="top:'+y(v)+'px">'+v+'m</span>';});
  MOM.forEach(m=>{const dim=S.filter&&!inFilter(m);
    h+='<button class="'+m.k+(dim?' dim':'')+(S.flash===m.id?' cur':'')+'" style="top:'+y(m.m)+'px" aria-label="'+m.t+' '+(m.k==='good'?'went well':'fix')+'"'+(dim?' tabindex="-1"':' onclick="act.jump(\''+m.id+'\')"')+'></button>';});
  return '<div class="map" aria-label="Meeting timeline">'+h+'</div>';
}
function rhead(){
  return '<div class="cs-rhead"><h3>Review your conversation</h3>'+
    '<div class="mseg" role="group" aria-label="Show"><button aria-pressed="'+(S.mode==='moments')+'" onclick="act.mode(\'moments\')">Moments only</button><button aria-pressed="'+(S.mode==='all')+'" onclick="act.mode(\'all\')">All turns</button></div>'+
    '<div class="key"><span><i style="background:#0EBE75"></i>Went well · '+MOM.filter(m=>m.k==='good').length+'</span><span><i style="background:#d97706"></i>To work on · '+MOM.filter(m=>m.k==='fix').length+'</span></div></div>';
}
function rightCol(){
  return rhead()+
    '<div class="cs-scroll" id="cs-scroll">'+mapHTML()+'<div class="conv">'+visibleTurns().map(turnHTML).join('')+'</div></div>';
}

const STARTERS=['How clear was I when Maya asked if anyone had confirmed?','Did I answer Daniel\u2019s worry about changes close to the date?','How did I come across when explaining the room costs?'];
function drawerHTML(){
  if(!S.drawer)return '';
  let body='';
  if(S.drawer==='all'){
    body='<div class="ai"><span class="av"><img src="'+BUBBLE+'" alt=""></span><div class="tx"><p>Ask me anything about how this call went. I can only see what was said in it, by you and the others.</p><p>Try one of these, or write your own.</p><div class="chips">'+
      STARTERS.map((s,i)=>'<button class="starter" onclick="act.starter('+i+')">'+s+'</button>').join('')+'</div></div></div>';
  } else {
    const t=byId(S.ctx);
    body='<div class="quote"><b>About this turn · '+(t.who==='you'?'You':t.who)+' · '+t.t+'</b>'+t.x.replace(/<\/?mark>/g,'')+'</div>';
    if(S.ctx==='m4'){
      body+='<div class="me">How clear was my response?</div>'+
      '<div class="ai"><span class="av"><img src="'+BUBBLE+'" alt=""></span><div class="tx">'+
      '<p>Clear in the end, but not at first. Maya asked a yes-or-no question: is anyone confirmed? You opened with marketing and Daniel, and \u201cwe don\u2019t have anyone committed yet\u201d came last. Until then, she could easily have heard \u201cyes, marketing\u201d.</p>'+
      '<p>Lead with the status, then the detail:</p>'+
      '<p><b>\u201cNot yet. Marketing is interested, and I\u2019m setting up a call with them and Daniel.\u201d</b></p>'+
      '<p>You did this well earlier, at <button class="ts" onclick="act.jumpTo(\'m8\')">'+byId('m8').t+'</button>, when she asked about cost: \u201cYes, the company pays. We\u2019ve built that into the budget.\u201d</p>'+
      '<div class="chips"><span class="pill p-cap">Reporting and summarising</span></div>'+
      '<div class="nexts" style="max-width:560px">'+lessonBtn('stat')+lessonBtn('stat','cv')+'</div></div></div>'+
      '<div class="chips" style="align-self:flex-end"><button class="starter" onclick="act.noop()">Where else did I bury the answer?</button><button class="starter" onclick="act.noop()">How did I come across to Maya?</button></div>';
    } else {
      body+='<div class="ai"><span class="av"><img src="'+BUBBLE+'" alt=""></span><div class="tx"><p>What would you like to know about this turn?</p><div class="chips">'+
        ['How clear was this?','How did this come across?','What could I say instead?'].map(q=>'<button class="starter" onclick="act.noop()">'+q+'</button>').join('')+'</div>'+
        '</div></div>';
    }
  }
  return '<button class="scrim" aria-label="Close" onclick="act.close()"></button><div class="drawer" role="dialog" aria-label="Ask about this conversation">'+
    '<div class="dr-hd"><div><b>Ask about this conversation</b><small>Team offsite planning · answers use this call’s transcript only</small></div><button class="dr-x" aria-label="Close" onclick="act.close()">'+I.x+'</button></div>'+
    '<div class="dr-body">'+body+'</div>'+
    '<div class="dr-comp"><label for="ask-input" class="sr" style="position:absolute;left:-9999px">Ask a question</label><input id="ask-input" placeholder="'+(S.drawer==='all'?'Ask about this conversation…':'Ask a follow-up…')+'"><button class="send" aria-label="Send" onclick="act.noop()">'+I.send+'</button></div></div>';
}

const PRACTICE={from:'n6',title:'Explaining Where a Project Stands',goal:'Explain where the project is now and what comes next.',
  me:'This year our goal is to prove the idea: do people find it valuable, and can we afford to repeat it?',fb:'Situation first. Nice.',
  ai2:'That makes sense. What would you need to see from this event to repeat it?'};
function practicePrompt(){
  const i=T.findIndex(t=>t.id===PRACTICE.from);let j=i-1;while(j>=0&&T[j].who==='you')j--;
  const p=T[j],parts=p.x.match(/[^.?!]+[.?!]+/g)||[p.x],q=parts.findIndex(x=>x.includes('?'));
  let x=parts.slice(Math.max(0,q)).join('').trim().replace(/^((um|uh|so|okay|oh|and|like),?\s+)+/i,'');
  return {who:p.who,t:p.t,x:x.charAt(0).toUpperCase()+x.slice(1)};
}
function practiceScreen(){
  if(S.redir)return '<div class="chrome"><i></i><i></i><i></i><span>Redirecting to Busuu…</span></div><div class="cs pr" id="cs"><div class="rd" role="status" aria-live="polite"><div class="rd-sp" aria-hidden="true"></div><h2>Redirecting to Busuu…</h2><p>Creating a custom scenario based on <b>your meeting</b>.</p><div class="rd-bar"><i></i></div><button onclick="act.practice(null)">Cancel</button></div></div>';
  const st=S.practice,done=st==='done',pp=practicePrompt();
  return '<div class="chrome"><i></i><i></i><i></i><span>Busuu \u00b7 AI Conversation</span></div>'+
  '<div class="cs pr" id="cs">'+
    '<div class="pr-top"><button class="pr-x" aria-label="Close and go back to your feedback" onclick="act.practice(null)">'+I.x+'</button><div class="pr-bar" role="progressbar" aria-valuenow="'+(done?1:0)+'" aria-valuemax="3"><i style="width:'+(done?34:0)+'%"></i></div></div>'+
    '<div class="pr-main">'+
      '<div class="pr-title">'+PRACTICE.title+'</div>'+
      '<div class="pr-goal"><span class="tg">\ud83c\udfaf</span>'+PRACTICE.goal+'</div>'+
      '<div class="pr-chat">'+
        '<div class="pr-ai">'+pp.x+'<br><button class="spk" aria-label="Play">'+I.spk+'</button></div>'+
        (done?'<div class="pr-me">'+PRACTICE.me+'</div><span class="pr-fb">'+I.check+PRACTICE.fb+'</span>'+
          '<div class="pr-ai">'+PRACTICE.ai2+'<br><button class="spk" aria-label="Play">'+I.spk+'</button></div>':'')+
      '</div></div>'+
    '<div class="pr-foot"><button class="pr-mic'+(st==='rec'?' rec':'')+'" aria-label="'+(st==='rec'?'Stop recording':'Record')+'" onclick="act.mic()">'+I.mic+'</button>'+
      '<span class="pr-hint">'+(st==='rec'?'Recording\u2026 click to stop':'Click to record')+'</span></div>'+
  '</div>';
}

function screen(){
  if(S.practice)return practiceScreen();
  const g=glanceC();
  return '<div class="cs" id="cs">'+
    '<div class="cs-hd"><button class="cs-back" onclick="act.back()">← Back to dashboard</button><div class="cs-title"><b>'+MEETING.title+'</b><small>'+MEETING.date+' · 35 min · 3 people</small></div><button class="cs-cta" onclick="act.noop()">Go to Busuu →</button></div>'+
    '<div class="cs-body"><div class="cs-left" id="cs-left">'+g+focusCard()+rating()+'</div><div class="cs-right">'+rightCol()+'</div></div>'+
    '<div class="cs-comp"><button class="askbox" onclick="act.drawer()"><span class="sp">Ask about this conversation…</span><span class="send">'+I.send+'</span></button>'+
      '<button class="starter" onclick="act.starter(0)">How clear was I with Maya?</button><button class="starter" onclick="act.drawer()">More questions</button></div>'+
    drawerHTML()+
  '</div>';
}

let rdT=null;
function startRedir(){S.redir=true;clearTimeout(rdT);rdT=setTimeout(()=>{if(S.practice&&S.redir){S.redir=false;render();}},2400);}
const act={
  noop(){},
  breakdown(){S.breakdown=!S.breakdown;render();},
  practice(st){S.practice=st;S.drawer=null;if(st==='start')startRedir();else{clearTimeout(rdT);S.redir=false;}render();},
  mic(){S.practice=S.practice==='rec'?'done':'rec';render();},
  cat(i){S.openCats=S.openCats.includes(i)?S.openCats.filter(x=>x!==i):S.openCats.concat(i);render();},
  glance(k){S.filter=(k&&S.filter!==k)?k:null;S.flash=null;S.drawer=null;S.mode='moments';S.scrollTo=S.filter?'first':'top';S.smooth=true;render();},
  mode(m){S.mode=m;render();},
  focusGo(){S.filter='cap:'+FOCUS_CAP;if(!S.openCats.includes(4))S.openCats=S.openCats.concat(4);S.drawer=null;S.flash=null;S.mode='moments';S.scrollTo='first';S.smooth=true;render();},
  jump(id){S.smooth=true;S.flash=id;S.filter=S.filter&&inFilter(byId(id))?S.filter:null;S.scrollTo=id;render();},
  jumpTo(id){S.smooth=true;S.drawer=null;S.ctx=null;S.filter=null;S.flash=id;S.scrollTo=id;render();},
  ask(id){S.drawer='turn';S.ctx=id;render();},
  starter(i){if(i===0){S.drawer='turn';S.ctx='m4';}else{S.drawer='all';}render();},
  drawer(){S.drawer='all';S.ctx=null;render();},
  close(){S.drawer=null;S.ctx=null;render();}
};

const stage=document.getElementById('stage'),dbstage=document.getElementById('dbstage');
let dbframe=null,dbReady=false,dbPending=null,saved={conv:0,left:0};
function render(){
  const d=document.getElementById('device');if(!d)return;
  const sc=document.getElementById('cs-scroll'),lf=document.getElementById('cs-left');
  if(sc)saved.conv=sc.scrollTop; if(lf)saved.left=lf.scrollTop;
  d.innerHTML=screen();
  const sc2=document.getElementById('cs-scroll'),lf2=document.getElementById('cs-left');
  if(!sc2){S.scrollTo=null;S.smooth=false;fit();return;}
  if(lf2)lf2.scrollTop=saved.left;
  if(S.scrollTo==='first'){const f=S.filter&&MOM.find(inFilter);S.scrollTo=f?f.id:'top';}
  const smooth=S.smooth&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
  const go=y=>{if(smooth){sc2.scrollTop=saved.conv;sc2.scrollTo({top:y,behavior:'smooth'});}else sc2.scrollTop=y;};
  if(S.scrollTo==='top'){go(0);}
  else if(S.scrollTo){const el=sc2.querySelector('[data-id="'+S.scrollTo+'"]');if(el)go(Math.max(0,el.offsetTop-90));else sc2.scrollTop=saved.conv;}
  else sc2.scrollTop=saved.conv;
  S.smooth=false;
  S.scrollTo=null;
  fit();
}
function fit(){
  const d=document.getElementById('device');if(!d||!d.offsetWidth)return;
  const M=Math.min(24,innerWidth*.02),s=Math.min((innerWidth-2*M)/d.offsetWidth,(innerHeight-2*M)/d.offsetHeight);
  d.style.transform='scale('+s+')';d.style.left=Math.max(0,(innerWidth-d.offsetWidth*s)/2)+'px';d.style.top=Math.max(0,(innerHeight-d.offsetHeight*s)/2)+'px';
}
window.addEventListener('resize',fit);
function showEval(){
  dbstage.hidden=true;stage.hidden=false;
  Object.assign(S,{practice:null,breakdown:false,filter:null,drawer:null,ctx:null,flash:null,mode:'moments',scrollTo:'top'});
  clearTimeout(rdT);S.redir=false;
  render();
}
function showDash(step){
  stage.hidden=true;dbstage.hidden=false;
  if(!dbframe){
    dbframe=document.createElement('iframe');dbframe.className='dbframe';dbframe.title='Busuu Companion';
    dbframe.onload=()=>{dbReady=true;if(dbPending){dbframe.contentWindow.postMessage(dbPending,'*');dbPending=null;}};
    dbframe.src='dashboard.html#step:'+step;dbstage.appendChild(dbframe);
  } else if(dbReady)dbframe.contentWindow.postMessage({step},'*');
  else dbPending={step};
}
act.back=()=>showDash('prog');
window.addEventListener('message',e=>{
  if(!dbframe||e.source!==dbframe.contentWindow||!e.data)return;
  if(e.data.open==='eval')showEval();
});
if(window.ResizeObserver)new ResizeObserver(fit).observe(document.documentElement);
document.addEventListener('keydown',e=>{
  if(e.code==='KeyN'&&e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&dbframe&&dbReady&&!dbstage.hidden&&!/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'')){e.preventDefault();dbframe.contentWindow.postMessage({notif:true},'*');}
});
showDash('home');
</script>
